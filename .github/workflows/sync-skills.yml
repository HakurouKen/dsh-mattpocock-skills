name: Sync upstream skills

# Vendors github.com/mattpocock/skills once a day, so this package never drifts
# from upstream. Re-runs are no-ops: the sync script compares content digests,
# not timestamps, so a day with no upstream change commits nothing.

on:
  schedule:
    # Daily at 00:00 UTC. GitHub runs scheduled workflows on a best-effort
    # basis and may start this a few minutes late during peak load; the
    # `schedule` trigger only ever fires on the default branch.
    - cron: '0 0 * * *'
  # Lets you run it from the Actions tab before trusting the schedule.
  workflow_dispatch:

# The job writes a commit, so it needs write access to repository contents.
permissions:
  contents: write

# Never let two syncs race for the same branch: a second run would either
# rebase onto the first or fail to push.
concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    name: Vendor upstream and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check whether upstream moved
        id: stale
        # `--check` clones upstream and compares the staged tree with vendor/,
        # exiting 1 when they differ. Skipping the sync when nothing changed
        # keeps the job fast and makes "no commit" the everyday outcome.
        run: |
          if node scripts/sync-skills.mjs --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync from upstream
        if: steps.stale.outputs.stale == 'true'
        run: node scripts/sync-skills.mjs

      - name: Verify the vendored tree and package contracts
        if: steps.stale.outputs.stale == 'true'
        # A sync that breaks the catalog must never reach the branch. The 44
        # checks include the registry validators, so a malformed upstream
        # SKILL.md fails here instead of shipping.
        run: node scripts/verify.mjs

      - name: Commit and push
        if: steps.stale.outputs.stale == 'true'
        env:
          # The default GITHUB_TOKEN cannot trigger further workflows, which is
          # what we want: this commit is data, not a release.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # Only `skills/` is generated; refuse to commit anything else so a
          # stray local write in this job cannot ride along.
          git add -- skills
          if git diff --cached --quiet; then
            echo "No vendored changes to commit."
            exit 0
          fi

          commit=$(node -e 'const m=require("./skills/PROVENANCE.json");process.stdout.write(m.upstream.commit.slice(0,12))')
          describe=$(node -e 'const m=require("./skills/PROVENANCE.json");process.stdout.write(m.upstream.describe??"")')
          version=$(node -e 'const m=require("./skills/PROVENANCE.json");process.stdout.write(m.upstream.version??"unknown")')
          count=$(node -e 'const m=require("./skills/PROVENANCE.json");process.stdout.write(String(m.skillCount))')

          git commit -m "chore: sync upstream skills to ${version} (${describe})" \
                     -m "Vendored ${count} skills from github.com/mattpocock/skills at ${commit}.

          Generated by .github/workflows/sync-skills.yml; see PROVENANCE.json."

          git push
          echo "Pushed ${commit} (${count} skills)."

      - name: Report no upstream change
        if: steps.stale.outputs.stale != 'true'
        run: echo "Upstream matches vendor/; nothing to commit."
